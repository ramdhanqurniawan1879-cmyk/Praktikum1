    <style>
        body {
            font-family: Arial; 
            background: white; 
            margin: 40px; 
        }

        .container {
            background: #f4f8ff;
            border: 1px solid #ccc;
            padding: 15px;
            width: 25%;
            margin: 0 auto;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        h1 {
            color: #1a56b0; 
            text-align: center; 
            margin-top: 0;
        }

        p {
            color: #333;
            margin-bottom: 15px;
        }

        table {
            border-collapse: collapse; 
            width: 100%; 
        }

        th {
            background: #1a56b0; 
            color: white; 
            padding: 8px; 
            text-align: left;
        }

        td {
            border: 1px solid #ccd; 
            padding: 8px; 
        }

        .aktif {
            background: #e6eefb; 
        }
        
        th:nth-child(2) {
            text-align: center;
        }

        td:nth-child(2) {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Judul Halaman</h1>
        <p>Paragraf dengan gaya.</p>

        <table>
            <tr>
                <th>Nama</th>
                <th>Nilai</th>
            </tr>
            <tr>
                <td>Budi</td>
                <td>85</td>
            </tr>
            <tr class="aktif">
                <td>Sari</td>
                <td>78</td>
            </tr>
        </table>
    </div>

</body>
</html>
